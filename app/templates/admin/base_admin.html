<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Админ-панель{% endblock %} · Ателье «Дом Быта»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧵</text></svg>">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="side-logo"><span>DB</span> Ателье · Админ</div>
    <nav class="side-nav">
      <a href="{{ admin_base }}" {% if page=='dashboard' %}class="active"{% endif %}><i>◧</i> Дашборд</a>
      <a href="{{ admin_base }}/orders" {% if page=='orders' %}class="active"{% endif %}><i>☰</i> Заявки</a>
      <a href="{{ admin_base }}/services" {% if page=='services' %}class="active"{% endif %}><i>✂</i> Услуги и цены</a>
      <a href="{{ admin_base }}/advantages" {% if page=='advantages' %}class="active"{% endif %}><i>◆</i> Условия и надбавки</a>
      <a href="{{ admin_base }}/gallery" {% if page=='gallery' %}class="active"{% endif %}><i>▦</i> Галерея работ</a>
      <a href="{{ admin_base }}/reviews" {% if page=='reviews' %}class="active"{% endif %}><i>★</i> Отзывы</a>
      <a href="{{ admin_base }}/settings" {% if page=='settings' %}class="active"{% endif %}><i>⚙</i> Настройки сайта</a>
      <a href="{{ admin_base }}/password" {% if page=='password' %}class="active"{% endif %}><i>🔑</i> Смена пароля</a>
    </nav>
    <div class="side-footer">
      <a href="/" target="_blank" class="side-view">↗ Открыть сайт</a>
      <a href="{{ admin_base }}/logout" class="side-logout">Выйти ({{ admin }})</a>
    </div>
  </aside>
  <div class="admin-main">
    <header class="topbar">
      <h1>{% block heading %}{% endblock %}</h1>
      <span class="topbar-date">{{ today }}</span>
    </header>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
<script src="/static/js/admin.js"></script>
</body>
</html>
